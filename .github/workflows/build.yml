name: Build u search

# - Every commit to main: builds a signed APK -> download it under "Artifacts".
# - Publishing a GitHub Release (e.g. tag v0.1.0): builds the same APK and
#   attaches it to that release, which is what Komi Store and Obtainium install.

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/usearch.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/usearch.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE secret found - building with the debug key."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event_name == 'release' && github.ref_name || '' }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            NAME="u-search-${{ github.ref_name }}.apk"
          else
            NAME="u-search-${{ github.run_number }}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: u-search-apk
          path: ${{ env.APK_NAME }}

      - name: Attach APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.APK_NAME }}" --clobber --repo "${{ github.repository }}"
