name: Build u search

# Builds a signed, optimized APK every time something is committed to main.
# When the run turns green, open it and download "u-search-apk" under "Artifacts".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/usearch.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/usearch.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE secret found - building with the debug key."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "u-search-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: u-search-apk
          path: u-search-${{ github.run_number }}.apk
